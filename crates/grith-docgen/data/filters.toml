# Canonical metadata for the 18 active grith filters.
# Source-of-truth for the docs site. Keep this in sync with
# crates/grith-proxy/src/filters/. grith-docgen will warn when a filter
# source module exists without a matching entry here.
#
# Ordinals are 1..=18 across three phases: static (1-6), pattern (7-12),
# context (13-18). Intentionally NOT listed (they surface as `unmapped: true`
# in filters.json, which the docs FilterTable excludes):
#   - `semantic`          — inactive embedding-classifier stub, not in the
#                           shipped pipeline yet (documented separately; v1.5
#                           roadmap).
#   - `outbound_binaries` — a curated classifier registry used by the taint
#                           filter, not itself a `SecurityFilter`.

[[filters]]
ordinal = 1
module = "operation_risk"
name = "Operation risk scoring"
phase = "static"
score_range = [1.0, 3.0]
summary = "Assigns a baseline risk score based on the call's operation class (file_read, file_write, shell, network, etc)."

[[filters]]
ordinal = 2
module = "path_match"
name = "Static path matching"
phase = "static"
score_range = [2.0, 5.0]
config_file = "config/filters/paths.toml"
summary = "Aho-Corasick scan of paths against curated denylists and allowlists. Hot — runs against every fs operation."

[[filters]]
ordinal = 3
module = "sensitive_path"
name = "Sensitive path heuristic"
phase = "static"
score_range = [1.0, 4.0]
summary = "Detects access to known-sensitive files: .env*, id_rsa, id_ed25519, credentials.json, .aws/, .ssh/, .kube/, and similar."

[[filters]]
ordinal = 4
module = "allowlist"
name = "Allowlist / denylist"
phase = "static"
score_range = [-1.0, 3.0]
summary = "User-managed allow and deny rules. Approved entries lower the score; explicit denies raise it. Edited from the digest review UI."

[[filters]]
ordinal = 5
module = "argument"
name = "Argument length & structure"
phase = "static"
score_range = [0.0, 2.0]
summary = "Flags suspicious argument shapes: encoded payloads, oversized strings, shell metacharacters in unexpected positions."

[[filters]]
ordinal = 6
module = "capability"
name = "Capability enforcement"
phase = "static"
score_range = [0.0, 99.0]
config_file = "config/filters/capabilities.toml"
summary = "Hard gate: enforces per-profile capability grants. Returns DENY when the active supervisor profile does not permit this operation class."

[[filters]]
ordinal = 7
module = "secret_scan"
name = "Secret / credential scanning"
phase = "pattern"
score_range = [3.0, 5.0]
config_file = "config/filters/secrets.toml"
summary = "Scans content for embedded credentials. 1,617 regex patterns covering provider API keys, tokens, private keys, and bespoke credential formats."

[[filters]]
ordinal = 8
module = "command"
name = "Command structure analysis"
phase = "pattern"
score_range = [2.0, 4.0]
config_file = "config/filters/commands.toml"
summary = "Parses shell commands. Catches dangerous patterns: piped curl-to-sh, sudo with arbitrary scripts, fork-bombs, base64-encoded payloads in subshells."

[[filters]]
ordinal = 9
module = "destructive_action"
name = "Destructive action coverage"
phase = "pattern"
score_range = [3.5, 99.0]
summary = "Hard-denies catastrophic, irreversible host/storage destruction (filesystem format, raw block-device overwrite, recursive removal of a system root or database data directory) and escalates destructive operations directed at production (managed-DB endpoints, prod/live-tagged resources) to deny; other destructive operations queue for review. Also scores docker/podman run host-escalation."

[[filters]]
ordinal = 10
module = "egress_policy"
name = "Egress policy"
phase = "pattern"
score_range = [-1.0, 5.0]
config_file = "config/filters/egress.toml"
summary = "Network destination policy. Allowlisted hosts lower the score; denylisted or unknown hosts raise it. Plays with the reputation filter for adaptive trust."

[[filters]]
ordinal = 11
module = "dlp_gate"
name = "DLP gate"
phase = "pattern"
score_range = [3.0, 5.0]
config_file = "config/filters/dlp.toml"
summary = "Scans outbound network payloads for sensitive data leaving the box: credentials, PII, large file contents bundled into POST bodies."

[[filters]]
ordinal = 12
module = "canary"
name = "Canary secret detection"
phase = "pattern"
score_range = [99.0, 99.0]
config_file = "config/filters/canary.toml"
summary = "Hard DENY. Detects registered canary tokens (fake secrets seeded in your repo) reaching any outbound sink — definitive proof of exfiltration."

[[filters]]
ordinal = 13
module = "reputation"
name = "Destination reputation"
phase = "context"
score_range = [-1.0, 4.0]
config_file = "config/filters/domains.toml"
summary = "Per-destination trust accumulated over time. Established trusted hosts get a discount; suspicious or unfamiliar ones get a markup."

[[filters]]
ordinal = 14
module = "behavioural"
name = "Behavioural anomaly"
phase = "context"
score_range = [1.0, 3.0]
summary = "Compares the current call against the session's historical baseline (default 200-call minimum). Sudden bursts, unusual destinations, or out-of-pattern operations contribute score."

[[filters]]
ordinal = 15
module = "taint"
name = "Taint tracking"
phase = "context"
score_range = [0.0, 5.0]
summary = "Tracks data flow from sensitive sources (e.g. a .env read) through subsequent operations. Network calls or shell execs that reference tainted data inherit taint."

[[filters]]
ordinal = 16
module = "session_containment"
name = "Session containment"
phase = "context"
score_range = [0.0, 5.0]
config_file = "config/filters/containment.toml"
summary = "Enforces per-session isolation zones. A session bound to project A cannot reach project B's files or network without explicit cross-zone approval."

[[filters]]
ordinal = 17
module = "rate_limit"
name = "Rate limiting"
phase = "context"
score_range = [0.0, 99.0]
summary = "Per-minute caps on file writes (default 30), shell execs (20), and network requests (60). Bursts trigger queue; sustained violations trigger DENY. Volume penalties are risk-gated by default."

[[filters]]
ordinal = 18
module = "egress_rate"
name = "Egress rate / burst detection"
phase = "context"
score_range = [1.0, 3.0]
summary = "Per-destination outbound rate and burst detection. Flags rapid bursts of network egress to the same or many destinations — a beaconing or exfil shape that single-call filters miss."
