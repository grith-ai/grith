# Supervisor profiles — pre-built allowlist templates for common CLI tools.
# These reduce noise by auto-allowing routine operations that are expected
# for each tool. Non-routine operations still go through the full proxy pipeline.
#
# Variable expansion: ${PROJECT_DIR} and ${HOME} are resolved at runtime.
#
# Resolution model:
#   1. Static profile chain (child → parent via `extends` → [defaults])
#   2. Optional provider overlay (additive destinations only)
#   3. Optional launcher overlay (additive commands/paths only)
#
# Named tool profiles extend `generic` (not `generic-cli`) and list their own
# destinations explicitly. `generic-cli` is available for manual `--profile`
# opt-in only.

# ── Control-socket and delegating-spawn carveouts (opt-in, per profile) ──────
#
# Two keys exist on every profile and are DELIBERATELY unset everywhere below.
# They are documented here because an undocumented escape hatch is one nobody
# can use, and because setting either one wrongly hands a supervised tool a way
# out of supervision.
#
#   permit_control_sockets = ["…"]
#     Case-insensitive path substrings. A connect to a matching IPC socket skips
#     control-socket escalation. These sockets let a tool drive a
#     more-privileged peer that runs commands on its behalf — tmux/screen pane
#     injection, X11 input synthesis, session D-Bus method calls — so a match
#     here is a decision to trust the tool with the operator's session.
#
#     Do NOT add a blanket "/.X11-unix/" entry. Routine clipboard use
#     (`xclip`/`xsel`/`wl-copy` writing the selection, resolved by canonical
#     path at a system binary root) is already allowed without a permit; a
#     blanket entry would additionally cover clipboard READS and every unknown
#     X11 client, which is the escape the enforcement exists to close.
#
#     Legitimate example — a tool whose whole job is driving a tmux session,
#     where the operator has accepted that:
#       # permit_control_sockets = ["/tmp/tmux-1000/default"]
#
#   permit_authority_delegating = ["…"]
#     Binary BASENAMES whose spawn skips authority-delegating escalation
#     (systemd-run, at, docker, nsenter, …). Those run work in a process that is
#     not a ptrace descendant of the supervised tool, so none of its syscalls
#     are intercepted.
#       # permit_authority_delegating = ["docker"]
#
# Both are per-profile, both default empty, and neither is set by any shipped
# profile.

# ═══════════════════════════════════════════════════════════════════════════════
# Defaults — merged into every profile (universal, local-only settings)
# ═══════════════════════════════════════════════════════════════════════════════

[defaults]

routine_paths = [
    # System introspection (read-only, world-readable)
    "/proc",
    "/etc/profile.d",
    # Rust toolchain — cargo cache (registry, git checkouts, package-cache-mutate
    # lock file) and rustup toolchain storage. Routine for any Rust dev workflow;
    # safe to mark routine because trust here grants file I/O only, not exec.
    "${HOME}/.cargo/**",
    "${HOME}/.rustup/**",

    # Node toolchain install trees — destination for `npm install -g` across
    # the common version managers. LLM tools (claude-code, codex, …) self-
    # update by running `npm install -g <pkg>` which writes hundreds of files
    # into these trees and triggers rate-limit prompts. Trust here is file I/O
    # only; `routine_exec_roots` for the same trees is handled per-tool
    # profile (so only the relevant @vendor/<pkg> binaries become trusted to
    # spawn, not arbitrary binaries the user `npm install -g`'d).
    "${HOME}/.local/share/mise/installs/**",
    "${HOME}/.nvm/versions/**",
    "${HOME}/.volta/tools/image/**",
    "${HOME}/.local/share/pnpm/global/**",

    # ─── Toolchain scratch dirs under /tmp ───────────────────────────────────
    # High-churn install/build scratch. Trust here grants file I/O only — the
    # exec axis is independent (PR 4 routine_exec_roots), so a payload dropped
    # into one of these still gets QUEUE'd at spawn time. Prefixes are
    # tool-specific naming conventions, not blanket /tmp.

    # Rust — cargo install bootstrap, cargo-target overrides, cargo-fetch
    "/tmp/cargo-*",
    # Rust — rustc compilation tempdirs (e.g. /tmp/rustcW0EmZ7/lib.meta)
    "/tmp/rustc*",

    # Node — npm cacache staging, yarn v1 (double-dash is intentional),
    # node-gyp build dir, V8 per-user compile caches
    "/tmp/npm-*",
    "/tmp/yarn--*",
    "/tmp/.node-gyp*",
    "/tmp/v8-compile-cache-*",

    # Python — pip install/build-env/req-build/unpack/wheel-cache staging,
    # uv (modern installer) staging
    "/tmp/pip-*",
    "/tmp/uv-*",

    # PHP — composer install staging
    "/tmp/composer-*",

    # Go — build cache scratch
    "/tmp/go-build*",

    # C / C++ — gcc/clang tempfiles. Suffix-scoped on purpose: .o and .s are
    # not dlopen targets, .ld is consumed only by the immediately-spawned
    # linker. A bare `/tmp/cc*` would allow .so writes, which IS dlopen-
    # reachable, so we don't widen the glob.
    "/tmp/cc*.o",
    "/tmp/cc*.s",
    "/tmp/cc*.ld",
    # Linker staging
    "/tmp/ld-*",

    # ─── Browser runtime scratch ─────────────────────────────────────────────
    # Chromium-family browsers (Chrome, Chromium, Electron apps) create a
    # shared-memory segment per renderer under these name templates, plus a
    # per-instance singleton dir in /tmp — dozens of random-named files per
    # page load, one measured headless-Chrome test run answered 57 prompts
    # for them. Trust is file I/O only under the browser's own templates;
    # the browser SPAWN, its network egress, and its D-Bus traffic are all
    # still scored on their own axes.
    "/dev/shm/.com.google.Chrome.*",
    "/dev/shm/.org.chromium.Chromium.*",
    "/tmp/.com.google.Chrome.*",
    "/tmp/com.google.Chrome.*",
    "/tmp/.org.chromium.Chromium.*",

    # mktemp's default template — `mktemp` with no arguments, which is what
    # agent-generated shell uses for every scratch file. Each name is random,
    # so no exact approval can ever cover the next one: one measured session
    # answered 28 prompts for these alone. Trust here grants file I/O only —
    # a payload staged in /tmp still gets scored at spawn and at egress.
    "/tmp/tmp.*",

    # Ruby — bundler tempdirs
    "/tmp/bundler*",

    # JVM — perf data dir (per-user) and attach-mechanism sockets
    "/tmp/hsperfdata_*",
    "/tmp/.java_pid*",

    # .NET — nuget scratch and dotnet CLI staging
    "/tmp/NuGetScratch/",
    "/tmp/dotnet-*",
]

routine_commands = [
    # Shells and environment
    "bash", "sh", "env",
    # File inspection
    "cat", "ls", "find", "grep", "rg", "fd", "head", "tail", "wc",
    "diff", "patch", "file",
    # File manipulation
    "mkdir", "cp", "mv", "rm", "touch", "chmod", "stat", "ln",
    "readlink", "realpath", "dirname", "basename",
    # Text processing
    "tr", "cut", "sort", "uniq", "sed", "awk", "xargs", "tee", "jq",
    # Encoding / decoding — `base64` shows up on every Claude Code / Codex
    # Bash tool call because both wrap the user command as
    # `bash -c "... eval $(echo <b64-cmd> | base64 -d)"`. Marking it
    # routine silences the prompt flood; the actual payload is in the
    # *bash* invocation argv, where it stays subject to taint scoring.
    "base64",
    # System info
    "which", "uname", "id", "whoami", "date",
    # Output and control flow
    "test", "true", "false", "echo", "printf",
    # Terminal
    "stty", "tput",
    # System utilities
    "getopt", "getconf", "lsb_release", "dpkg-query", "dpkg", "ps",
    # Git and SCM
    "git", "ssh",
    # Linker chain — invoked by rustc/cargo/cc during every compile. Listed
    # individually rather than via routine_exec_roots so they don't get the
    # `exec-prefix:` short-circuit that would bypass taint scoring. clang
    # and ld can both load arbitrary code via `-fplugin` / linker scripts,
    # so taint must still apply to them under a contaminated session; the
    # `exec:<canonical>` pin from routine_commands keeps provenance checks
    # while still letting the taint filter score additively.
    "clang", "ld", "ld.bfd", "ld.gold", "ld.lld", "mold", "lld",
]

# No shared destinations in defaults — outbound trust belongs in
# per-tool profiles or explicit opt-in profiles.
routine_destinations = []

routine_exec_roots = [
    # Git helper binaries (git-remote-http, git-credential-*, etc.)
    "/usr/lib/git-core/",
    # Rust toolchain binaries — rustup-managed (rustc, cargo, rustdoc, clippy,
    # rustfmt, etc.) plus cargo's installed-bins dir. PR 4 provenance check
    # verifies component-writability before trusting; the path itself does not
    # bypass other proxy filters.
    "${HOME}/.rustup/toolchains/",
    "${HOME}/.cargo/bin/",
]

# Read-only trusted paths — auto-allow reads only, not writes.
readonly_paths = [
    # SSH metadata needed for git operations — NOT private keys
    "${HOME}/.ssh/config",
    "${HOME}/.ssh/known_hosts",
    "${HOME}/.ssh/known_hosts2",
    # Git config (read-only — writes still reviewed)
    "${HOME}/.gitconfig",
    "${HOME}/.config/git/config",
]

readonly_path_patterns = [
    # SSH public keys and certificates — NOT secret material.
    "${HOME}/.ssh/*.pub",
    "${HOME}/.ssh/*-cert",
    "${HOME}/.ssh/*-cert.pub",
]

# ═══════════════════════════════════════════════════════════════════════════════
# Base profiles — generic (strict fallback) and generic-cli (manual opt-in)
# ═══════════════════════════════════════════════════════════════════════════════

[[profiles]]
name = "generic"
display_name = "Generic Tool"
rationale = "Generic is intentionally narrow and only allows basic project-local file inspection and low-risk commands by default. This is the shipped fallback/default profile."

routine_paths = [
    "${PROJECT_DIR}/**",
]

routine_commands = []
routine_destinations = []
routine_listen_addresses = []

[[profiles]]
name = "generic-cli"
display_name = "Generic CLI Tool"
extends = "generic"
rationale = "Opt-in shared profile for local developer CLI tools that routinely use git, GitHub, and VS Code / Microsoft infrastructure but do not have a dedicated named profile. Use via --profile generic-cli. NOT the default parent for named tool profiles."

routine_paths = [
    "${PROJECT_DIR}/**",
]

routine_commands = [
    "code",
]

routine_destinations = [
    # GitHub
    "github.com", "api.github.com",
    "githubusercontent.com", "raw.githubusercontent.com",
    # VS Code / Microsoft tooling
    "visualstudio.com", "vsassets.io", "microsoft.com",
]

routine_listen_addresses = []

[[profiles]]
name = "grith-repl"
display_name = "Grith REPL"
extends = "generic"
rationale = "Built-in Grith REPL policy base. Used with provider overlays to scope proxy and reputation behavior for interactive sessions."

routine_paths = [
    "${PROJECT_DIR}/**",
]

routine_commands = []
routine_destinations = []
routine_listen_addresses = []

# ═══════════════════════════════════════════════════════════════════════════════
# Named tool profiles — extend generic, list own destinations explicitly
# ═══════════════════════════════════════════════════════════════════════════════

[[profiles]]
name = "claude-code"
display_name = "Claude Code"
extends = "generic"
rationale = "Claude Code routinely reads project files, shells out to local build and SCM tools, and contacts Anthropic plus package and repository infrastructure."
# Claude Code ships its own inner sandbox (filesystem isolation plus a network
# egress allowlist). Under grith the supervisor is already the access-control
# boundary, so the inner sandbox is redundant — and its allowlist silently
# blocks legitimate egress (e.g. ssh to your own hosts) with EPERM. Disable it
# so grith remains the single source of truth for what the tool may reach.
launch_contract = { required_args = ["--dangerously-skip-permissions", "--settings", "{\"sandbox\":{\"enabled\":false}}"] }

routine_paths = [
    "${PROJECT_DIR}/**",
    # Claude Code application state
    "${HOME}/.config/claude-code/**",
    "${HOME}/.claude/**",
    "${HOME}/.local/state/claude/**",
    "${HOME}/.cache/claude-cli-nodejs/**",
    "${HOME}/.cache/claude/**",
    "/tmp/claude-*",
    # Node.js ecosystem
    "${HOME}/.npm/**",
    "${HOME}/.node_modules/**",
    # VS Code application state (Claude Code integrates with VS Code)
    "${HOME}/.config/Code/**",
    "${HOME}/.vscode/**",
    "${HOME}/.vscode-server/**",
    # Headless-browser app state (web-dev / screenshot testing). Chrome/Chromium
    # rewrite these on every launch; they are the browser's own profile/cache,
    # not user secrets. The NSS certificate store (~/.pki/nssdb) is handled
    # read-only via readonly_path_patterns below so a CA-injection *write* still
    # runs the full proxy.
    "${HOME}/.config/google-chrome/**",
    "${HOME}/.config/chromium/**",
    "${HOME}/.cache/google-chrome/**",
    "${HOME}/.cache/chromium/**",
    "/tmp/.org.chromium.Chromium.*",
    "/tmp/.com.google.Chrome.*",
]

# Browser NSS certificate DB: reads are pure startup noise, but a WRITE could
# inject a trusted CA (TLS MITM). Only FileReads are auto-allowed here; writes,
# deletes and renames still run the full proxy pipeline so CA changes stay
# visible. `*` is a single-segment wildcard (matches cert9.db, key4.db, …).
readonly_path_patterns = [
    "${HOME}/.pki/nssdb/*",
]

routine_commands = [
    # Node.js
    "node", "npm", "npx",
    # SCM extensions
    "gh",
    # Rust toolchain
    "cargo", "rustc",
    # Python
    "python", "python3", "pip", "pip3",
    # JavaScript tooling
    "tsc", "eslint", "prettier",
    # Additional text processing
    "envsubst", "gettext",
    # Network
    "curl",
    # Archive / compression
    "tar", "gzip", "gunzip", "unzip",
    # System utilities
    "tmux", "seq", "yes", "timeout", "nproc",
    # VS Code CLI (extension listing, editor integration)
    "code",
    # Headless browser automation (web-dev / screenshot testing)
    "chromium", "chromium-browser", "google-chrome", "google-chrome-stable", "firefox",
]

routine_destinations = [
    # Anthropic — base domain for subdomain matching in session allowlist
    "anthropic.com",
    # Anthropic — specific subdomains for DNS forward cache seeding
    "api.anthropic.com",
    "statsig.anthropic.com",
    "cdn.anthropic.com",
    # Claude web and platform
    "claude.ai",
    "claude.com",
    # GitHub (gh command integration)
    "github.com", "api.github.com",
    "githubusercontent.com", "raw.githubusercontent.com",
    # npm
    "npmjs.org",
    "registry.npmjs.org",
    # Rust packages
    "crates.io",
    "static.crates.io",
    # Python packages
    "pypi.org",
    "files.pythonhosted.org",
    # Telemetry
    "datadoghq.com",
    "sentry.io",
    # Statsig
    "statsig.com",
    "statsigapi.net",
    # Google Cloud Storage (update checks / asset downloads)
    "storage.googleapis.com",
    "googleapis.com",
    # VS Code marketplace/CDN
    "vscode.dev",
    "visualstudio.com",
    "vsassets.io",
    "microsoft.com",
    # VS Code update/asset CDN (e.g. main.vscode-cdn.net — used to download
    # the VS Code server binary and updates when Claude Code runs in the
    # integrated terminal). Base domain for subdomain matching.
    "vscode-cdn.net",
    # Headless-browser infrastructure — Google-CONTROLLED CDN/service hosts.
    # Safe-browsing / update / optimization-guide are already covered by the
    # `googleapis.com` base above; these are the remaining CDN hosts. NEVER add
    # a bare `googleusercontent.com` wildcard (user content = exfil channel) —
    # only the specific Google-run `clients2.googleusercontent.com` is listed.
    "clients2.google.com",
    "clients2.googleusercontent.com",
    "gvt1.com",
    "gstatic.com",
]

routine_listen_addresses = []

# PR 5 Phase G: `local_listener_policy` is intentionally empty here.
# Claude Code's default workflows don't bind any listener; mcp-server
# subcommands that do should QUEUE so the operator sees the bind. See
# `docs/SUPERVISOR-PROFILES.md` § "Authoring local_listener_policy"
# for the entry template and the meaning of `allow_clamp`.
local_listener_policy = []

routine_exec_roots = [
    # Claude-bundled helper binaries (rg, etc.) — reviewed, provenance-verified.
    # Justification: Claude Code bundles its own rg under this tree. Needed for
    # code search functionality. Ownership is user-only, permissions verified.
    "${HOME}/.local/share/claude/versions/",
    # Claude Code npm-global installs across version managers (PR 4 Phase B).
    # Glob entries are expanded at session start via the `glob` crate and
    # canonicalised before becoming `exec-prefix:` entries — so version
    # bumps stop prompting without enumerating every NN.NN.N path.
    "/usr/lib/node_modules/@anthropic-ai/claude-code",
    "${HOME}/.nvm/versions/node/*/lib/node_modules/@anthropic-ai/claude-code",
    "${HOME}/.volta/tools/image/packages/@anthropic-ai/claude-code/*",
    # VS Code system helpers
    "/usr/share/code/",
    # Version manager roots — node/python installed by nvm, mise, etc.
    # Justification: Claude Code spawns node/python from these managed roots.
    # Ownership verified, provenance checked at runtime.
    # TODO(T-09): re-review after executable-attestation model lands (work/44).
    "${HOME}/.nvm/versions/",
    "${HOME}/.local/share/mise/",
    "${HOME}/.local/share/nvm/",
]

# Rate-limit burst exemption only (every other filter still runs). Claude Code
# extracts/rewrites large numbers of files under its XDG cache on startup
# (random ~/.cache/.tmpXXXX/ staging dirs, node code-cache, package unpacking),
# which trips the burst threshold and queues routine work. These roots are not
# trusted for anything else — secret-scan, deny-list and write-target checks
# still apply.
scratch_roots = [
    "${HOME}/.cache",
]

[[profiles]]
name = "codex"
display_name = "OpenAI Codex CLI"
extends = "generic"
rationale = "Codex routinely reads project and local CLI state, shells out to common development tools, and contacts OpenAI and repository infrastructure."
# PR 70: grith is the supervising security layer here, so codex's own
# approval/sandbox flow is redundant — and it surfaces prompts to the
# user that bypass grith's audit trail. `--dangerously-bypass-approvals-
# and-sandbox` is codex's "I trust the outer security layer" switch;
# the equivalent is wired for claude-code (`--dangerously-skip-
# permissions`) at line 142. EXTREMELY DANGEROUS without an outer
# enforcer — only safe because grith is supervising every syscall.
launch_contract = { required_args = ["--dangerously-bypass-approvals-and-sandbox"] }

routine_paths = [
    "${PROJECT_DIR}/**",
    "${HOME}/.codex/**",
    "${HOME}/.config/codex/**",
    "${HOME}/.npm/**",
    "/tmp/codex-*",
    # Headless-browser app state (web-dev / screenshot testing). Chrome/Chromium
    # rewrite these on every launch; they are the browser's own profile/cache,
    # not user secrets. The NSS certificate store (~/.pki/nssdb) is handled
    # read-only via readonly_path_patterns below so a CA-injection *write* still
    # runs the full proxy.
    "${HOME}/.config/google-chrome/**",
    "${HOME}/.config/chromium/**",
    "${HOME}/.cache/google-chrome/**",
    "${HOME}/.cache/chromium/**",
    "/tmp/.org.chromium.Chromium.*",
    "/tmp/.com.google.Chrome.*",
]

# Browser NSS certificate DB: reads are pure startup noise, but a WRITE could
# inject a trusted CA (TLS MITM). Only FileReads are auto-allowed here; writes,
# deletes and renames still run the full proxy pipeline so CA changes stay
# visible. `*` is a single-segment wildcard (matches cert9.db, key4.db, …).
readonly_path_patterns = [
    "${HOME}/.pki/nssdb/*",
]

routine_commands = [
    "node", "npm", "npx",
    "cargo", "rustc",
    "python", "python3", "pip", "pip3",
    "tmux", "curl",
    # JavaScript tooling
    "tsc", "eslint", "prettier",
    # SCM extensions
    "gh",
    # Archive / compression
    "tar", "gzip", "gunzip", "unzip",
    # System utilities
    "seq", "nproc", "timeout", "yes",
    # Headless browser automation (web-dev / screenshot testing)
    "chromium", "chromium-browser", "google-chrome", "google-chrome-stable", "firefox",
]

routine_destinations = [
    # OpenAI
    "api.openai.com",
    "openai.com",
    "auth.openai.com",
    "chatgpt.com",
    # GitHub (gh command integration)
    "github.com", "api.github.com",
    "githubusercontent.com", "raw.githubusercontent.com",
    # npm
    "npmjs.org",
    "registry.npmjs.org",
    # Rust packages
    "crates.io",
    "static.crates.io",
    # Python packages
    "pypi.org",
    "files.pythonhosted.org",
    # Headless-browser infrastructure — Google-CONTROLLED service endpoints only
    # (component update, safe-browsing, optimization-guide, CDN). These are
    # fixed hosts the agent cannot influence. NEVER add a bare
    # `googleusercontent.com` wildcard: it serves user content (Drive/Sites/
    # script exec) and would hand every tool an exfil channel — only the
    # specific Google-run `clients2.googleusercontent.com` host is listed.
    "safebrowsing.googleapis.com",
    "update.googleapis.com",
    "optimizationguide-pa.googleapis.com",
    "clients2.google.com",
    "clients2.googleusercontent.com",
    "gvt1.com",
    "gstatic.com",
]

# Changed from ["0.0.0.0"] — investigation confirmed no default Codex
# behaviour needs wildcard bind. Loopback is auto-allowed by grith.
# PR 5 Phase B: `routine_listen_addresses` is now strictly loopback-only;
# wildcard binds must go through `local_listener_policy` (see below).
routine_listen_addresses = []

# PR 5 Phase G + PR 69 Change 3: `local_listener_policy` declares the
# local IPC ports Codex legitimately binds. The MCP transport entry below
# was added after audit-log evidence (session 7f256630-…, 2026-05-25)
# showed Codex's startup binding `0.0.0.0:0` (kernel-assigned ephemeral
# port) for its localhost MCP transport. Without an entry, PR 5's
# `wildcard-bind-undeclared` rule denied every bind (46 in a single
# startup) and blocked the MCP handshake. `allow_clamp = true` lets the
# supervisor silently rewrite the sockaddr to loopback at the syscall-
# argument level — the listener is reachable on 127.0.0.1 only and the
# rewrite is audited. If your workflow needs additional ports, copy the
# template from `docs/SUPERVISOR-PROFILES.md` § "Authoring
# local_listener_policy".
#
# Inline-table array syntax is required here because later keys in this
# profile (`namespace_users`, `routine_exec_roots`, …) would otherwise be
# scoped under the listener entry by TOML's table-header rules.
local_listener_policy = [
    # `port = 0` matches exactly the kernel-assigned-ephemeral binds (the
    # tool passes literal port 0) — it is not an any-port wildcard. `family
    # = "any"` covers the v6 form of the same idiom (`[::]:0`), which the
    # old "v4" entry left prompting.
    { port = 0, family = "any", desc = "Codex MCP transport — kernel-assigned localhost port", allow_clamp = true },
]

# PR 6 Phase C: namespace_users — binaries Codex's bootstrap legitimately
# spawns to set up its own sandbox. These canonical paths are allowed
# to invoke `unshare(2)` / `setns(2)` silently — but ONLY when the same
# canonical path is ALSO under a `routine_exec_root` below. Both
# conditions are required (fail-safe): an attacker who somehow drops
# their own `/usr/bin/bwrap` outside a routine root gets QUEUE'd.
#
# NOTE: by default `/usr/bin` is NOT in `routine_exec_roots` for the
# codex profile, so these entries are effectively dormant until the
# operator explicitly adds `/usr/bin/` (or a tighter subpath like
# `/usr/bin/bwrap` literal) to `routine_exec_roots`. That's the right
# safety posture — measure before trusting.
namespace_users = [
    "/usr/bin/bwrap",
    "/usr/bin/bubblewrap",
    "/usr/bin/firejail",
    "/usr/bin/nsenter",
    "/usr/bin/unshare",
]

routine_exec_roots = [
    # Codex npm-global installs across version managers (PR 4 Phase B).
    # Glob entries are expanded at session start, so minor-version bumps
    # of @openai/codex stop prompting without enumerating each version.
    "/usr/lib/node_modules/@openai/codex",
    "${HOME}/.local/share/codex",
    "${HOME}/.nvm/versions/node/*/lib/node_modules/@openai/codex",
    "${HOME}/.volta/tools/image/packages/@openai/codex/*",
    "${HOME}/.local/share/pnpm/global/*/node_modules/@openai/codex",
    # Version manager roots — node/python installed by nvm, mise, etc.
    "${HOME}/.nvm/versions/",
    "${HOME}/.local/share/mise/",
    "${HOME}/.local/share/nvm/",
]

# Rate-limit burst exemption only (see claude-code profile for rationale).
# Codex churns the same XDG cache staging dirs on startup.
scratch_roots = [
    "${HOME}/.cache",
]

[[profiles]]
name = "aider"
display_name = "Aider"
extends = "generic"
rationale = "Aider is primarily a git- and Python-centric coding workflow with access to common LLM provider endpoints."

routine_paths = [
    "${PROJECT_DIR}/**",
    "${HOME}/.aider*",
    "${HOME}/.config/aider/**",
    "${HOME}/.streamlit/**",
    "/tmp/aider-*",
]

routine_commands = [
    "python", "python3", "pip", "pip3",
    "cargo",
    "node", "npm",
    "curl",
    # Python tooling
    "flake8",
    # Streamlit browser mode
    "streamlit",
]

routine_destinations = [
    # LLM providers
    "api.openai.com",
    "api.anthropic.com",
    "api.deepseek.com",
    "openrouter.ai",
    # Python packages (daily version check)
    "pypi.org",
    # PostHog analytics (opt-in, 10% sample)
    "us.i.posthog.com",
    # Tokenizer data
    "huggingface.co",
]

routine_listen_addresses = []

