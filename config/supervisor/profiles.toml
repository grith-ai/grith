[[profiles]]
name = "openclaw"
display_name = "OpenClaw"
rationale = "OpenClaw is a local AI agent platform (Node.js) that orchestrates browser automation via Chromium/Chrome, messaging integrations via signal-cli and other helpers, and sandboxed code execution via Docker. It contacts multiple LLM providers and messaging platform APIs."

routine_paths = [
    "${HOME}/.openclaw/**",
    "${HOME}/.config/openclaw/**",
    "${HOME}/.local/share/openclaw/**",
    "${HOME}/.cache/openclaw/**",
    "/tmp/openclaw-*",
    "${PROJECT_DIR}/**",
]

routine_commands = [
    # OpenClaw runtime
    "node", "npm", "npx", "pnpm", "openclaw",
    # Browser automation
    "chromium", "chromium-browser", "google-chrome", "google-chrome-stable",
    # Messaging helpers
    "signal-cli",
    # Container execution
    "docker", "docker-compose",
    # Python tooling (for helper scripts / plugins)
    "python3", "pip3",
    # Additional utilities
    "tmux", "curl",
]

routine_destinations = [
    # LLM providers
    "anthropic.com",
    "api.anthropic.com",
    "openai.com",
    "api.openai.com",
    "openrouter.ai",
    "ollama.ai",
    # Messaging platform APIs (base domains for subdomain matching)
    "telegram.org",
    "api.telegram.org",
    "slack.com",
    "slack-edge.com",
    "discord.com",
    "discordapp.com",
    "whatsapp.com",
    "web.whatsapp.com",
    "signal.org",
    "storage.signal.org",
    "chat.google.com",
    "hangouts.google.com",
    "matrix.org",
    "mattermost.com",
    "irc.libera.chat",
    # Package management
    "registry.npmjs.org",
    # Asset delivery
    "storage.googleapis.com",
]

routine_listen_addresses = [
    # Loopback only — Node.js gateway binds locally; 0.0.0.0 is intentionally excluded.
    "127.0.0.1",
]

