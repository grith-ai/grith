# ═══════════════════════════════════════════════════════════════════════════════
# Launcher overlays — small, additive, context-specific trust
# ═══════════════════════════════════════════════════════════════════════════════

[[launcher_overlays]]
name = "vscode-terminal"
detect_parent_names = ["code", "code-insiders", "codium"]
detect_env = ["TERM_PROGRAM=vscode"]
routine_commands = ["code"]
routine_paths = []

[[launcher_overlays]]
name = "cursor-terminal"
detect_parent_names = ["cursor"]
detect_env = []
routine_commands = []
routine_paths = []

