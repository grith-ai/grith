# Grith default configuration
# See docs/grith-SPEC.md for full reference

[general]
log_level = "info"
audit_dir = "~/.local/share/grith/audit"
plan_tier = "community"  # "community", "pro", or "enterprise"
audit_sync = true         # set to false to keep audit records local-only; license checks still use grith.ai
# onboarded = false        # managed automatically: the first-run wizard, `grith init`, and
#                          # scripts/setup.sh set this to true. A fresh install (no user config)
#                          # is treated as not-yet-onboarded; pre-flag configs migrate to true.
# exec_notice_seen = false # managed automatically: set to true after the one-line `grith exec`
#                          # first-run notice prints once.

[audit]
# Completeness tier for the audit log. Higher tiers add forensic /
# analytics value at the cost of DB growth and supervisor-thread
# overhead.
#
#   decisions = only proxy-evaluated events (today's historical behaviour).
#   spawns    = + a compact row for every routine ProcessSpawn short-
#               circuit (find, grep, ls, base64, …). Answers "what
#               binaries did this session execute?" with modest write
#               volume. Default.
#   io        = + compact rows for routine file reads / writes. Forensic-
#               ish; ~+100 MB/day under typical dev workloads.
#   all       = + compact rows for noise-path events (/proc/, /dev/null,
#               /var/cache/, CA cert dirs, …). Best for compliance / SIEM
#               exports; requires retention tuning (~+500 MB/day).
#
# Compact rows omit filter_results / filter_scores / composite_score
# and carry only the call type, supervised pid + tool, and a short
# argument summary. The dashboard hides them by default; toggle
# "Show routine activity" on the audit page to reveal them.
completeness = "spawns"

[proxy]
auto_allow_threshold = 3.0
auto_deny_threshold = 8.0
# Every tool call is evaluated against these fixed thresholds — there is no
# call-count "cold-start" threshold widening. The first call in a session is
# filtered identically to the thousandth, so an early destructive/exfil
# operation is never under-scored.
review_timeout_seconds = 300  # auto-deny queued calls after 5 minutes

[proxy.spawn]
# Keep both spawn prompt-reduction signals off by default until operators
# review telemetry/profile inventory for their environment.
routine_provenance_signal = false
# Data-flow taint-on-spawn (PR 2). Default ON (FP research §5.2): the legacy
# "any session taint → +3.0 on every spawn/connect" flagged
# read-credential-then-use-credential (~/.npmrc → npm, ~/.kube/config →
# kubectl). The data-flow rule still catches genuine exfil.
taint_data_flow_only = true
# Narrow condition 4 of the data-flow taint rule (FP §5.2). When true, an
# outbound-capable binary under taint (`git push`, `aws s3 ls`, `npm publish`)
# only fires when the spawn actually references the tainted data (argv
# path/env, pipe/redirect, shell-pattern) — not merely because a credential was
# read earlier and the tool is outbound-capable. Genuine exfil still fires via
# conditions 1–3/5, and outbound-to-untrusted-destination is scored by egress.
# Set false to restore the standalone outbound-binary fire.
taint_outbound_requires_data_flow = true

[proxy.rate_limit]
# Gate the rate-limit filter's volume penalties (burst/per-minute/approaching)
# on per-op risk, so a burst of untainted routine file churn (~/.cache, .git/
# internals, build outputs) never escalates. The supervisor's target-aware
# mass-destruction signal backfills the one case this drops (an untainted
# destructive spree). See work/futurework/rate-limit-burst-redesign.md.
#
# ON by default (rollout step 4). Setting this false restores the legacy
# frequency-blind burst counter and also forfeits the scratch/~/.cache/.git
# exemptions (retired in favour of this gate) — expect routine-churn prompts.
risk_gated_burst = true

[proxy.destructive_action]
# Work item 68: destructive-action coverage. Hard-denies catastrophic
# host/storage destruction (mkfs, dd-to-device, wipefs, rm --no-preserve-root,
# recursive removal of a system root or database data directory) and escalates
# destructive operations directed at production (prod DB endpoints, or
# prod/production/live-tagged resources) from QUEUE to DENY. Non-production
# destructive ops QUEUE; scoped dev operations (rm -rf of project dirs,
# single-object staging deletes, read-only queries) are not flagged.
# ON by default — this is the coverage behind grith's "blocks the destructive
# step" claim. Set false to disable the whole filter.
enabled = true

[proxy.filters.reputation]
enabled = true
domains_file = "config/filters/domains.toml"
unknown_domain_score = 1.0
malicious_domain_score = 4.0
safe_domain_score = -1.0
ip_address_score = 2.0

[proxy.filters.behavioural]
enabled = true
min_calls_for_baseline = 200
mild_deviation_score = 1.0
significant_deviation_score = 3.0

[proxy.filters.taint]
enabled = true
sensitive_paths = [".env", ".env.local", "credentials.json", "secrets.yaml", "id_rsa", "id_ed25519"]
high_risk_sinks = ["network", "shell"]
medium_risk_sinks = ["file_write"]

[proxy.filters.rate_limit]
enabled = true
file_writes_per_minute = 30
shell_execs_per_minute = 20
network_requests_per_minute = 60
burst_multiplier = 3.0
cooldown_seconds = 30

[proxy.filters.semantic]
enabled = false  # Stub in v1.5, requires local embedding model
model = "all-MiniLM-L6-v2"

[proxy.filters.egress]
enabled = true
config_file = "config/filters/egress.toml"

[proxy.filters.session_containment]
enabled = true
config_file = "config/filters/containment.toml"

[reputation]
enabled = true
decay_lambda = 0.98
deny_weight = 3.0
auto_allow_trust = 0.92
auto_allow_min_observations = 8
max_score_reduction = 4.0
ceiling_filter_threshold = 5.0
max_auto_allow_raw_score = 7.0
save_interval_seconds = 300

[digest]
interval_active = "30m"
interval_idle = "24h"
delivery = "cli"
max_queue_size = 100

[llm]
default_provider = "ollama"

[llm.ollama]
base_url = "http://localhost:11434"
model = "llama3.1:8b"

[llm.openai]
model = "gpt-4o-mini"

[llm.anthropic]
model = "claude-sonnet-4-5-20250514"

[llm.openrouter]
model = "anthropic/claude-sonnet-4-5-20250514"

[supervisor]
enabled = true
default_profile = "generic"
freeze_timeout_seconds = 300
max_concurrent_sessions = 4
pty_forwarding = true
require_sandbox = false
# Linux attach mechanism: "traceme" (shipped) | "seize" (work in progress —
# selecting it currently aborts with a clear error). See
# work/futurework/ptrace-seize-migration.md.
attach_mode = "traceme"
# H2 Option 1 (IPC-delegated authority): enforce PTY ownership. When false
# (default), writes to a /dev/pts/N that is NOT the supervised tool's own
# controlling terminal are detected and forensically logged
# (event = "foreign_pts_write") but still allowed — audit-only, to measure the
# false-positive budget. Set true to DENY them (the `echo cmd > /dev/pts/<other
# pane>` IPC-injection vector). See work/futurework/ipc-delegated-authority-escape.md.
pty_ownership_enforce = false
# Enforce the authority-delegating-binary-spawn detection. When false,
# spawning systemd-run / at / docker / systemctl / dbus-send / … is detected and
# forensically logged but still allowed (audit-only). When true (the default
# since v0.2.5), such a spawn is escalated Allow→QUEUE for review unless the
# profile's permit_authority_delegating
# list names the binary — closing the `systemd-run --user … -- <cmd>` supervision
# escape (the command's effect runs in a peer OUTSIDE the supervised tree, where
# nothing it does is intercepted). Escalation is QUEUE, not deny, so you can
# approve legitimate use once (the approval sticks for the session, and
# read-only subcommands like `docker ps` never prompt); a non-interactive
# session fails safe (denies) — set this false or use the profile permit list
# for unattended/CI sessions that legitimately delegate.
# Emergency override: GRITH_ENFORCE_AUTHORITY_DELEGATING_SPAWN=1 (or =0 to force off).
enforce_authority_delegating_spawn = true
# Enforce the control-injection-IPC-socket-connect detection (session D-Bus,
# tmux, screen, X11). When false such a connect is audit-only
# (auto-allowed as local IPC). When true (the default since v0.2.5) it is
# routed to the proxy and escalated
# Allow→QUEUE unless the profile's permit_control_sockets list authorises it.
# Independent knob — desktop tooling touches the session bus routinely, so this
# has a higher false-positive surface than the spawn flag. Known gap: abstract-
# namespace sockets (the kind X11 clients try first) are not yet matched — see
# the CHANGELOG. Emergency override:
# GRITH_ENFORCE_CONTROL_SOCKET_CONNECT=1 (or =0 to force off).
enforce_control_socket_connect = true
# Seconds to keep running after the daemon stops accounting for this session
# (it answered a heartbeat with "I am not tracking you" — usually because it
# restarted while at its session cap). 0 = never terminate: the session keeps
# running with a loud warning and you decide. Terminating by default would
# destroy in-progress agent work over a daemon-side event you did not cause.
# Set a positive value in CI, where nobody is watching the warning.
authority_lost_terminate_after_seconds = 0

[supervisor.platform]
linux_mechanism = "ptrace"
macos_mechanism = "endpoint-security"
seccomp_pre_filter = false

[supervisor.noise_reduction]
ignore_read_only = true
batch_rapid_reads = true
batch_window_ms = 50

[supervisor.dns_inspection]
# In-line DNS inspection (Linux). Discovers connected and unconnected UDP DNS
# destinations, parses every sendto/sendmsg/sendmmsg query before send, and
# lets allowed queries reach the machine's real resolver untouched. Malformed
# port-53 payloads fail closed. DoT (port 853) is denied.
enabled = true
# Observe DNS responses to populate the exact IP->domain cache the egress /
# reputation filters use. This promotes tracked recvfrom/recvmsg/recvmmsg calls
# to catch their exits (one tightly-scoped PTRACE_SYSCALL step per DNS receive).
# Query blocking does not depend on this. Default on.
observe_responses = true
# Deny TCP-DNS, forcing resolution onto the inspected UDP path. TCP-DNS can't be
# content-inspected (its query/response ride write()/read(), the hottest
# syscalls, deliberately not intercepted), so leaving it enabled would let a
# tool bypass query blocking over TCP. The rare cost is a lookup whose answer
# exceeds EDNS0-UDP size failing (modern resolvers use EDNS0 UDP up to 4 KB, so
# TCP fallback is seldom needed); such a case surfaces as a visible deny. Set
# false to allow TCP-DNS uninspected. Default on.
block_tcp_dns = true
# Canary path for connected UDP/53 sockets whose query/response use plain
# write()/read() and are therefore invisible to in-line inspection. Off until
# the Phase 0 resolver, namespace, race, lifecycle, and performance gates pass.
connected_udp_proxy = false
# A proxy-owned upstream socket can have network access the tracee lacks due to
# cgroups, firewall owner rules, SO_MARK/SO_BINDTODEVICE, or policy routing.
# Set true only after that authority difference is explicitly reviewed and
# accepted or equivalently contained. The proxy refuses to start otherwise.
accept_proxy_network_authority = false
# QUEUE-range policy decisions from either DNS inspection owner (the in-line
# sendto/sendmsg path and the connected-UDP proxy) enqueue review but refuse
# the current lookup. "forward" is an explicit compatibility mode which
# permits DNS before review and must not be used for complete-enforcement
# claims.
proxy_queue_action = "refuse"
# Bound the proxy data plane. Oversized responses fail explicitly rather than
# being silently truncated.
proxy_max_response_bytes = 4096
proxy_policy_timeout_ms = 1000
proxy_upstream_timeout_ms = 5000
# Bounds route-task draining; the owning thread is always joined afterward.
proxy_shutdown_timeout_ms = 2000
proxy_route_capacity = 256
proxy_query_capacity = 1024
proxy_control_capacity = 256
proxy_policy_capacity = 128

[server]
enabled = true
host = "127.0.0.1"
port = 3141
dashboard_dir = "dashboard/dist"
# Open the dashboard in your browser on startup, handing off the auth token via
# the URL fragment (never printed to the terminal). Auto-skipped on headless/SSH
# sessions. When false or unavailable, the CLI prints a single-use pairing URL
# instead. Override per-run with GRITH_AUTO_OPEN_DASHBOARD=0.
auto_open_dashboard = true

# [server.tls]
# cert_path = "/path/to/cert.pem"
# key_path = "/path/to/key.pem"
# Uncomment to enable native TLS. Alternatively, use a reverse proxy (nginx, Caddy)
# for TLS termination. See https://docs.grith.ai/docs/guides/reverse-proxy-tls

[server.rate_limit]
enabled = true
general_rps = 100
write_rps = 10
proxy_test_rps = 20
