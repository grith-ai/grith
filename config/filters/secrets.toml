severity = "critical"
message = "AWS RDS database password detected"

[[patterns]]
id = "aws-rds-connection-string"
regex = "(?i)(mysql|postgresql|postgres)://[^:]+:[^@]+@[a-z0-9\\-]+\\.rds\\.amazonaws\\.com"
