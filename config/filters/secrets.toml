severity = "critical"
message = "AWS STS temporary access key detected"

[[patterns]]
id = "aws-cognito-pool-id"
regex = "(?i)cognito[_\\-]?pool[_\\-]?id\\s*[=:]\\s*['\"]?[a-z]{2}-[a-z]+-[0-9]_[A-Za-z0-9]{9}['\"]?"
