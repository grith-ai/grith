# Secret scanning patterns for the security proxy
# Loaded by the secret_scan filter (Phase 2)
# 1600+ patterns covering cloud providers, SaaS tokens, private keys, and credentials

# =============================================================================
# Category 1: AWS (~40 patterns)
# =============================================================================

[[patterns]]
id = "aws-access-key-id"
regex = "AKIA[0-9A-Z]{16}"
score = 5.0
severity = "critical"
message = "AWS access key ID detected"

[[patterns]]
id = "aws-secret-access-key"
regex = "(?i)aws[_\\-]?secret[_\\-]?access[_\\-]?key\\s*[=:]\\s*[A-Za-z0-9/+=]{40}"
score = 5.0
severity = "critical"
message = "AWS secret access key detected"

[[patterns]]
id = "aws-session-token"
regex = "(?i)aws[_\\-]?session[_\\-]?token\\s*[=:]\\s*[A-Za-z0-9/+=]{100,}"
score = 5.0
severity = "critical"
message = "AWS session token detected"

[[patterns]]
id = "aws-mws-auth-token"
regex = "amzn\\.mws\\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
score = 5.0
severity = "critical"
message = "AWS MWS auth token detected"

[[patterns]]
id = "aws-sts-assumed-role"
regex = "AROA[0-9A-Z]{16}"
score = 4.5
severity = "critical"
message = "AWS STS assumed role ID detected"

[[patterns]]
id = "aws-sts-federated-user"
