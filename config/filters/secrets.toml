severity = "critical"
message = "AWS Cognito client secret detected"

[[patterns]]
id = "aws-rds-password"
regex = "(?i)(rds|aurora)[_\\-]?(master[_\\-]?)?password\\s*[=:]\\s*['\"]?[^\\s'\"]{8,}['\"]?"
