message = "AWS Cognito pool ID detected"

[[patterns]]
id = "aws-cognito-client-secret"
regex = "(?i)cognito[_\\-]?(client[_\\-]?)?secret\\s*[=:]\\s*['\"]?[A-Za-z0-9+/=]{40,}['\"]?"
