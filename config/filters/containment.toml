[containment]
enabled = true

# After sensitive reads, keep the session in a stricter outbound mode.
containment_window_seconds = 600

# Paths/keywords that arm containment when read.
sensitive_sources = [
  ".env",
  ".ssh",
  ".aws",
  ".gnupg",
  ".kube/config",
  "id_rsa",
  "id_ed25519",
  "credentials",
  "secrets",
  "passwd",
  "shadow",
  "keychain",
  "sam",
]

# Outbound shell command heuristics while containment is active.
outbound_command_tokens = [
  "curl ",
  "wget ",
  "nc ",
  "netcat ",
  "scp ",
  "ftp ",
  "sftp ",
  "nslookup ",
  " dig ",
]

# Score contributions while containment is active.
#
# network_score is deliberately below 4.0: containment must never be able to
# reach the 8.0 auto-deny threshold on its own. An outbound connect in a
# contained session always also carries operation-risk's net-connect baseline
# (0.5) plus, for any destination not on the egress allowlist,
# egress-policy's unknown-destination (3.5). At 4.5 that sum was 8.5 — a
# silent deny with no prompt, before any evidence about the call itself was
# weighed. 3.5 lands it on 7.5: queued for the operator instead.
network_score = 3.5
process_score = 4.0
shell_score = 3.5
