# Development / low-friction preset
# Higher thresholds = fewer interruptions

[general]
log_level = "info"

[proxy]
auto_allow_threshold = 5.0
auto_deny_threshold = 9.0
review_timeout_seconds = 120  # 2 minutes for permissive mode

[digest]
interval_active = "1h"
interval_idle = "48h"
max_queue_size = 200
