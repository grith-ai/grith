<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- FOUC guard (F4): resolve the theme before first paint.
         Order: localStorage 'grith-theme' -> prefers-color-scheme -> dark. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("grith-theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
          ) {
            theme = "light";
          }
        } catch (_) {
          /* storage unavailable - keep the dark default */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/grith.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f0d" />
    <title>grith dashboard</title>
  </head>
  <body class="bg-bg text-text font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
