name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Check API type drift
        run: |
          bash scripts/gen-api-types.sh
          if ! git diff --exit-code dashboard/src/types/api.ts; then
            echo "::error::dashboard/src/types/api.ts is out of date. Run scripts/gen-api-types.sh and commit the result."
            exit 1
          fi

      - name: Dashboard type-check
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Dashboard lint
        working-directory: dashboard
        run: npm run lint

      - name: Dashboard build
        working-directory: dashboard
        run: npm run build

      - name: Run dashboard tests
        working-directory: dashboard
        run: npm test

  msrv-check:
    name: MSRV Check (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@v2

      - name: Check workspace compiles on MSRV
        run: cargo check --workspace
