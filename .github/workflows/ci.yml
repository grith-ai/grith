name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Compile-only aarch64 cross-check (runs on x86 runners): arch regressions
  # in the supervisor fail fast in every PR without waiting for arm64
  # hardware. Native arm64 test execution is the separate test-arm64 job.
  cross-check-aarch64:
    name: Cross-check (aarch64)
    runs-on: ubuntu-latest
    needs: lint
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-check-aarch64

      - name: Install aarch64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Clippy (aarch64-unknown-linux-gnu)
        run: cargo clippy --target aarch64-unknown-linux-gnu -p grith-supervisor --all-targets -- -D warnings

  # Native arm64 execution of the full workspace (work/78 PR D): the
  # supervisor's ptrace+seccomp semantics cannot be validated by qemu-user,
  # so the aarch64 backend is tested on a real arm64 kernel here. Rust-only —
  # the dashboard steps stay on the x86 Test job.
  test-arm64:
    name: Test (arm64)
    runs-on: ubuntu-24.04-arm
    # A wedged tracee blocks next_event() indefinitely (the in-test timeout
    # asserts only fire between events) — bound the job instead of hanging.
    timeout-minutes: 45
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-arm64

      # The ptrace integration tests compile C helpers with `cc` at test
      # time (a hard .expect, not a skip) and rusqlite builds bundled
      # sqlite3 — make the toolchain explicit rather than trusting the
      # image default.
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Run tests
        run: cargo test --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Check API type drift
        run: |
          bash scripts/gen-api-types.sh
          if ! git diff --exit-code dashboard/src/types/api.ts; then
            echo "::error::dashboard/src/types/api.ts is out of date. Run scripts/gen-api-types.sh and commit the result."
            exit 1
          fi

      - name: Dashboard type-check
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Dashboard lint
        working-directory: dashboard
        run: npm run lint

      - name: Dashboard build
        working-directory: dashboard
        run: npm run build

      - name: Run dashboard tests
        working-directory: dashboard
        run: npm test

  msrv-check:
    name: MSRV Check (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@v2

      - name: Check workspace compiles on MSRV
        run: cargo check --workspace
