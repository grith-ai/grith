name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # v0.1.0 is Linux-only. The supervisor uses ptrace+seccomp which
        # is Linux-specific; macOS Endpoint Security and Windows ETW
        # parity are tracked for v2.0 (work/31, work/32 in the private
        # repo). Re-add the macOS/Windows entries when those land.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux musl targets)
        if: contains(matrix.target, 'musl')
        run: cargo install cross --locked

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build dashboard
        if: hashFiles('dashboard/package.json') != ''
        working-directory: dashboard
        run: npm ci && npm run build

      - name: Build release binary (cross)
        if: contains(matrix.target, 'musl')
        run: cross build --release --target ${{ matrix.target }} -p grith-core

      - name: Build release binary (cargo)
        if: "!contains(matrix.target, 'musl')"
        run: cargo build --release --target ${{ matrix.target }} -p grith-core

      - name: Create archive (Unix)
        if: matrix.ext == ''
        run: |
          ARCHIVE_NAME="grith-${{ env.VERSION }}-${{ matrix.target }}.tar.gz"
          tar czf "${ARCHIVE_NAME}" \
            -C target/${{ matrix.target }}/release \
            grith
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Verify archive contents (Unix)
        if: matrix.ext == ''
        run: tar tzf "${{ env.ARCHIVE_NAME }}" | grep -qx 'grith'

      - name: Create archive (Windows)
        if: matrix.ext == '.exe'
        shell: pwsh
        run: |
          $archiveName = "grith-${{ env.VERSION }}-${{ matrix.target }}.zip"
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/grith.exe" `
            -DestinationPath $archiveName
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify archive contents (Windows)
        if: matrix.ext == '.exe'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead("${{ env.ARCHIVE_NAME }}").Entries.Name
          if ($entries -notcontains "grith.exe") { throw "Archive missing grith.exe" }
          Write-Host "Archive verified: contains grith.exe"

      - name: Generate SHA-256 checksum (Unix)
        if: matrix.ext == ''
        run: |
          sha256sum "${{ env.ARCHIVE_NAME }}" > "${{ env.ARCHIVE_NAME }}.sha256"

      - name: Generate SHA-256 checksum (Windows)
        if: matrix.ext == '.exe'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ env.ARCHIVE_NAME }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ env.ARCHIVE_NAME }}" | Out-File -FilePath "${{ env.ARCHIVE_NAME }}.sha256" -NoNewline

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grith-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lhR artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
