name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # cosign keyless signing needs the workflow to request a short-lived
  # OIDC token from GitHub (used to obtain a Fulcio signing certificate).
  # We do NOT use GitHub's attestations API — SLSA provenance is signed
  # with cosign and shipped as a release asset (see the SLSA step below),
  # which works on any plan including private repos.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # v0.1.x is Linux x86_64 only. The supervisor uses ptrace+seccomp
        # which is Linux-specific (macOS via Endpoint Security and
        # Windows via ETW are v2.0 — work/31, work/32). Within Linux,
        # the supervisor's syscall-arg extraction hard-codes x86_64
        # register names (orig_rax, rdi, rsi, r10, ...) and uses
        # ptrace::getregs/setregs which exist on x86_64 but not aarch64.
        # Add aarch64-unknown-linux-musl back when the supervisor's
        # arch backend ports are in (separate work item).
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux musl targets)
        if: contains(matrix.target, 'musl')
        run: cargo install cross --locked

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build dashboard
        if: hashFiles('dashboard/package.json') != ''
        working-directory: dashboard
        run: npm ci && npm run build

      - name: Build release binary (cross)
        if: contains(matrix.target, 'musl')
        run: cross build --release --target ${{ matrix.target }} -p grith-core

      - name: Build release binary (cargo)
        if: "!contains(matrix.target, 'musl')"
        run: cargo build --release --target ${{ matrix.target }} -p grith-core

      - name: Create archive (Unix)
        if: matrix.ext == ''
        run: |
          ARCHIVE_NAME="grith-${{ env.VERSION }}-${{ matrix.target }}.tar.gz"
          tar czf "${ARCHIVE_NAME}" \
            -C target/${{ matrix.target }}/release \
            grith
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Verify archive contents (Unix)
        if: matrix.ext == ''
        run: tar tzf "${{ env.ARCHIVE_NAME }}" | grep -qx 'grith'

      - name: Create archive (Windows)
        if: matrix.ext == '.exe'
        shell: pwsh
        run: |
          $archiveName = "grith-${{ env.VERSION }}-${{ matrix.target }}.zip"
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/grith.exe" `
            -DestinationPath $archiveName
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify archive contents (Windows)
        if: matrix.ext == '.exe'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead("${{ env.ARCHIVE_NAME }}").Entries.Name
          if ($entries -notcontains "grith.exe") { throw "Archive missing grith.exe" }
          Write-Host "Archive verified: contains grith.exe"

      - name: Generate SHA-256 checksum (Unix)
        if: matrix.ext == ''
        run: |
          sha256sum "${{ env.ARCHIVE_NAME }}" > "${{ env.ARCHIVE_NAME }}.sha256"

      - name: Generate SHA-256 checksum (Windows)
        if: matrix.ext == '.exe'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ env.ARCHIVE_NAME }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ env.ARCHIVE_NAME }}" | Out-File -FilePath "${{ env.ARCHIVE_NAME }}.sha256" -NoNewline

      # ---------------------------------------------------------------
      # Supply-chain artefacts: SBOM + cosign signatures + SLSA attestation.
      # See docs/RELEASE.md for the verification commands users should run.
      # ---------------------------------------------------------------

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Generate CycloneDX SBOM (Unix)
        if: matrix.ext == ''
        run: |
          # Emit a CycloneDX 1.5 JSON SBOM rooted at grith-core (the
          # binary's entrypoint crate). The output describes the full
          # transitive dependency tree as resolved in Cargo.lock.
          cargo cyclonedx --manifest-path crates/grith-core/Cargo.toml --format json --target ${{ matrix.target }}
          # cargo-cyclonedx writes to crates/grith-core/<name>.cdx.json
          # by default — rename to match the archive for easy pairing.
          SBOM_SRC=$(find crates/grith-core -maxdepth 1 -name "*.cdx.json" -print -quit)
          if [ -z "$SBOM_SRC" ]; then
            echo "cargo-cyclonedx did not produce an SBOM"; exit 1
          fi
          cp "$SBOM_SRC" "${{ env.ARCHIVE_NAME }}.cdx.json"

      - name: Sign tarball with cosign (Unix, keyless via GitHub OIDC)
        if: matrix.ext == ''
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle "${{ env.ARCHIVE_NAME }}.cosign.bundle" \
            "${{ env.ARCHIVE_NAME }}"

      - name: Sign SBOM with cosign (Unix)
        if: matrix.ext == ''
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle "${{ env.ARCHIVE_NAME }}.cdx.json.cosign.bundle" \
            "${{ env.ARCHIVE_NAME }}.cdx.json"

      # Build the SLSA v1 provenance predicate from the workflow context.
      # This is the same predicate the first-party attestation action emits;
      # we sign it ourselves (below) rather than persisting it to GitHub's
      # attestations API, which is a paid feature for private repos.
      - name: Generate SLSA build-provenance predicate (Unix)
        id: slsa-predicate
        if: matrix.ext == ''
        uses: actions/attest-build-provenance/predicate@v2

      - name: Sign SLSA provenance with cosign (Unix, keyless via GitHub OIDC)
        if: matrix.ext == ''
        env:
          COSIGN_YES: "true"
          # Passed via env (not inlined into the script) so the predicate JSON
          # cannot break shell quoting or inject into the run block.
          PREDICATE: ${{ steps.slsa-predicate.outputs.predicate }}
          PREDICATE_TYPE: ${{ steps.slsa-predicate.outputs.predicate-type }}
        run: |
          printf '%s' "$PREDICATE" > provenance-predicate.json
          # cosign attest-blob wraps the predicate in an in-toto statement over
          # the archive's digest and signs it keyless (Fulcio cert from the
          # workflow's OIDC identity, anchored in Rekor) — same signer identity
          # as the archive/SBOM signatures above. Ships as a release asset.
          cosign attest-blob \
            --predicate provenance-predicate.json \
            --type "$PREDICATE_TYPE" \
            --bundle "${{ env.ARCHIVE_NAME }}.intoto.bundle" \
            "${{ env.ARCHIVE_NAME }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grith-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
            ${{ env.ARCHIVE_NAME }}.cdx.json
            ${{ env.ARCHIVE_NAME }}.cosign.bundle
            ${{ env.ARCHIVE_NAME }}.cdx.json.cosign.bundle
            ${{ env.ARCHIVE_NAME }}.intoto.bundle
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lhR artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
