# cargo-deny configuration
# Run: cargo deny check
# CI: .github/workflows/security-audit.yml

[advisories]
# cargo-deny 0.18 changed the schema: the severity strings on
# `vulnerability`, `unmaintained`, `yanked`, `notice` were replaced.
# Vulnerabilities still hard-deny via the default policy.
# `unmaintained` now takes a scope (none/workspace/transitive/all);
# "workspace" preserves the prior "warn for direct deps" behaviour
# without flooding on transitive-crate maintenance status.
unmaintained = "workspace"
yanked = "warn"

# Known-acceptable advisories. Mirrors .cargo/audit.toml — keep in
# sync. Each entry has a justification there. Review on every release.
ignore = [
    "RUSTSEC-2017-0008",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0037",
    "RUSTSEC-2026-0044",
    "RUSTSEC-2026-0045",
    "RUSTSEC-2026-0046",
    "RUSTSEC-2026-0047",
    "RUSTSEC-2026-0048",
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0097",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0141",
    # quick-xml 0.37.5 XML-parsing DoS (RUSTSEC-2026-0194/0195), transitive
    # via grith-notify → notify-rust → tauri-winrt-notification (Windows-only
    # toast notifications). Unreachable on Linux / untrusted-XML paths; no
    # semver-compatible patch. See .cargo/audit.toml for the full rationale.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
# cargo-deny 0.18 dropped `unlicensed` and `copyleft` (PR #611).
# License-failure handling is now driven entirely by `allow`/`deny`
# lists plus the default "deny anything not on allow" behaviour.
#
# Each license here is verified to be encountered in the current dep
# graph; cargo-deny 0.19 fails the run on unmatched allowances.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
